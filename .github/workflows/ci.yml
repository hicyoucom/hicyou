name: CI

on:
  pull_request:
  push:
    branches: [main, "release/v2-preview"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hicyou_test
      BETTER_AUTH_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-not-a-production-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAILS: admin@example.com
      RUN_DB_TESTS: "1"
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: hicyou_test
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d hicyou_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan source for secrets
        run: >-
          docker run --rm --volume "$PWD:/repo:ro"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir --redact --no-banner /repo
      - name: Install Bun
        run: npm install --global --no-audit --no-fund bun@1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check public boundary
        run: bun run open-source:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Apply database migrations
        run: bun run db:migrate
      - name: Verify migration idempotence
        run: bun run db:migrate
      - name: Unit and integration tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Build container image
        run: docker build --tag hicyou-open-source-ci:local .
      - name: Scan container image
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
          image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1
          --skip-version-check hicyou-open-source-ci:local
