services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: hicyou
      POSTGRES_USER: hicyou
      POSTGRES_PASSWORD: replace-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hicyou -d hicyou"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://hicyou:replace-me@postgres:5432/hicyou
      NODE_ENV: production
      PORT: 3000

volumes:
  postgres-data:
